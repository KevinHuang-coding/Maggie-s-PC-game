data:text/html;charset=utf-8,<!-- 
========================================================================
[遊戲名稱] 夢幻植物園 (Dream Botanical Garden)
[版本編號] Version 2.1.0 (皇家紅寶石與天價 NT$ 史詩平衡版)
[更新日期] 2026-05-17
[修改日誌]
  - v2.1.0: 全新引入「🔴 皇家紅寶石」貨幣，可透過真錢（NT$）大幅度加碼購買。
  - v2.1.0: 商店新增「紅寶石至尊專區」，販售超越極限的 3 大神話級「真・至高神域植物」。
  - v2.1.0: 重新平衡儲值價格與收成金幣，全面提升高級植物的經濟產值。
  - v2.0.0: 實作多盆栽系統與 10 大史詩種子，提升畫質與霓虹發光特效。
========================================================================
-->
<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><title>夢幻植物園 v2.1.0</title><style>body{font-family:'Segoe UI',Roboto,'Microsoft JhengHei',sans-serif;background:radial-gradient(circle at 50% 50%,#0c0b1a 0%,#020205 100%);color:#f8fafc;display:flex;flex-direction:column;align-items:center;min-height:100vh;margin:0;padding:20px;overflow-x:hidden;position:relative;}body::before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(rgba(244,63,94,0.1) 1px,transparent 0),radial-gradient(rgba(56,189,248,0.08) 2px,transparent 0);background-size:60px 60px,180px 180px;background-position:0 0,30px 30px;animation:starMove 90s linear infinite;z-index:-1;opacity:0.7;}@keyframes starMove{from{background-position:0 0,30px 30px;}to{background-position:60px 120px,90px 180px;}}.game-header{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1350px;margin-bottom:20px;gap:20px;padding:0 10px;}.main-title{font-size:28px;font-weight:900;color:#f43f5e;text-shadow:0 0 20px rgba(244,63,94,0.6),0 0 40px rgba(56,189,248,0.2);margin:0;letter-spacing:1px;}.top-right-dashboard{display:flex;gap:15px;background:rgba(15,23,42,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:15px;border-radius:20px;border:1px solid rgba(244,63,94,0.3);box-shadow:0 10px 40px rgba(0,0,0,0.6);}.dashboard-column{display:flex;flex-direction:column;gap:8px;}.status-card{background:rgba(2,6,23,0.6);padding:8px 16px;border-radius:12px;font-size:14px;font-weight:bold;border:1px solid rgba(255,255,255,0.05);box-shadow:inset 0 2px 4px rgba(0,0,0,0.3);min-width:125px;}.game-layout{display:flex;gap:25px;max-width:1350px;width:100%;position:relative;z-index:1;}.panel{background:rgba(15,23,42,0.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:22px;border-radius:25px;box-shadow:0 25px 60px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.06);color:#e2e8f0;display:flex;flex-direction:column;}.garden-panel{flex:2.2;box-shadow:0 0 50px rgba(244,63,94,0.15);border:1px solid rgba(244,63,94,0.2);}.pots-grid{display:flex;gap:15px;justify-content:center;margin:15px 0;flex-wrap:wrap;}.pot-card{background:linear-gradient(135deg,rgba(30,41,59,0.7) 0%,rgba(15,23,42,0.9) 100%);border:2px solid rgba(255,255,255,0.08);border-radius:20px;padding:15px;width:210px;text-align:center;box-shadow:0 15px 30px rgba(0,0,0,0.3),inset 0 1px 2px rgba(255,255,255,0.1);position:relative;transition:all 0.3s ease;}.pot-card.active-grow{border-color:rgba(244,63,94,0.4);box-shadow:0 0 25px rgba(244,63,94,0.15);}.pot-card.locked{background:rgba(15,23,42,0.4);border:2px dashed rgba(255,255,255,0.1);display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:280px;}.plant-stage{font-size:85px;height:100px;line-height:100px;margin-bottom:10px;position:relative;z-index:1;filter:drop-shadow(0 0 25px rgba(244,63,94,0.4));transition:transform 0.3s;}.pot-card.active-grow .plant-stage{animation:floatPlant 3s ease-in-out infinite;}@keyframes floatPlant{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-6px) scale(1.03);}}.pot-display{font-size:50px;margin-top:-20px;position:relative;z-index:1;filter:drop-shadow(0 10px 15px rgba(0,0,0,0.6));}.water-container{background:rgba(255,255,255,0.06);border-radius:8px;height:12px;overflow:hidden;margin:12px 0;border:1px solid rgba(255,255,255,0.03);}.water-bar{background:linear-gradient(90deg,#ef4444,#b91c1c);height:100%;width:100%;transition:width 0.2s ease;box-shadow:0 0 12px rgba(239,68,68,0.6);}.btn{border:none;padding:10px 16px;font-size:13px;border-radius:20px;cursor:pointer;font-weight:bold;transition:all 0.2s;width:100%;margin-bottom:6px;box-shadow:0 4px 6px rgba(0,0,0,0.2);color:white;text-shadow:0 1px 2px rgba(0,0,0,0.3);}.btn:hover{transform:translateY(-2px);box-shadow:0 6px 15px rgba(0,0,0,0.3);}.btn-water{background:linear-gradient(135deg,#10b981 0%,#059669 100%);}.btn-fertilize{background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);}.btn-harvest{background:linear-gradient(135deg,#eab308 0%,#ca8a04 100%);color:#020617;}.btn-unlock{background:linear-gradient(135deg,#38bdf8 0%,#0369a1 100%);}.btn-gacha-gold{background:linear-gradient(135deg,#ec4899 0%,#be185d 100%);}.btn-gacha-diamond{background:linear-gradient(135deg,#a855f7 0%,#7e22ce 100%);}.btn-cash{background:linear-gradient(135deg,#ef4444 0%,#dc2626 100%);}.btn-ruby{background:linear-gradient(135deg,#f43f5e 0%,#9f1239 100%);}.btn-water-mini{background:#10b981; border:none; color:white; border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer; font-weight:bold;}.btn:disabled,.btn-water-mini:disabled{background:#1e293b !important;color:#475569 !important;cursor:not-allowed;opacity:0.4;transform:none;box-shadow:none;text-shadow:none;}.section-title{margin-top:0;color:#f43f5e;border-bottom:2px solid rgba(244,63,94,0.3);padding-bottom:6px;font-size:17px;text-shadow:0 0 10px rgba(244,63,94,0.3);font-weight:bold;}.gacha-machine{background:rgba(30,41,59,0.3);border:1px dashed rgba(244,63,94,0.2);padding:12px;border-radius:15px;margin-bottom:12px;}.scroll-box{max-height:220px;overflow-y:auto;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:6px;background:rgba(2,6,23,0.4);scrollbar-width:thin;}.rarity-tag{font-size:10px;padding:2px 6px;border-radius:5px;color:white;font-weight:bold;margin-left:5px;}.epic-tag{background:linear-gradient(135deg,#f43f5e,#e11d48);box-shadow:0 0 10px rgba(244,63,94,0.5);}.mythic-tag{background:linear-gradient(135deg,#a855f7,#6b21a8);box-shadow:0 0 12px rgba(168,85,247,0.6);}</style></head><body><div class="game-header"><div class="main-title">🌌 夢幻植物園 v2.1.0</div><div class="top-right-dashboard"><div class="dashboard-column"><div class="status-card" style="color:#fbbf24;">🪙 遊戲金幣: <span id="coinTxt">500</span></div><div class="status-card" style="color:#f43f5e;">🔴 紅寶石: <span id="rubyTxt">0</span></div></div><div class="dashboard-column"><div class="status-card" style="color:#a855f7;">💎 遊戲鑽石: <span id="diamondTxt">5</span></div><div class="status-card" style="color:#38bdf8;">💩 產量肥料: <span id="fertTxt">2</span> 包</div></div></div></div><div class="game-layout"><div class="panel garden-panel"><h3 class="section-title" style="text-align:left;">🪴 我的多功能培育溫室</h3><div class="pots-grid" id="potsGrid"></div><div style="margin-top:10px;text-align:left;"><h4 style="margin:5px 0;font-size:14px;color:#cbd5e1;">🎒 儲藏背包（選取種子播種至上方空花盆）：</h4><div id="invList" class="scroll-box" style="max-height:130px;"></div></div><button class="btn" style="background:rgba(255,255,255,0.03); color:#64748b; font-size:11px; padding:4px; margin-top:15px; border:1px solid rgba(255,255,255,0.05);" onclick="clearSaveData()">⚠️ 重置花園全存檔</button></div><div class="panel" style="flex:1.1;"><h3 class="section-title">🏪 皇家金幣與紅寶石商店</h3><div class="scroll-box" id="marketList" style="max-height: 440px;"></div></div><div class="panel" style="flex:1;"><h3 class="section-title">💳 皇家真錢儲值店 (NT$)</h3><div class="gacha-machine" style="background:rgba(244,63,94,0.03);border-color:rgba(244,63,94,0.2);"><h4 style="margin:5px 0;color:#f43f5e;font-size:13px;">🔴 購買至尊紅寶石</h4><button class="btn btn-ruby" onclick="buyRubyWithCash(300,10)">💳 花費 NT$300 買 🔴10 顆</button><button class="btn btn-ruby" onclick="buyRubyWithCash(1490,60)">💳 花費 NT$1490 買 🔴60 顆</button><button class="btn btn-ruby" onclick="buyRubyWithCash(2990,150)">💳 花費 NT$2990 買 🔴150 顆</button></div><div class="gacha-machine" style="background:rgba(251,191,36,0.02);border-color:rgba(251,191,36,0.15);"><h4 style="margin:5px 0;color:#fbbf24;font-size:13px;">🌱 現金直購頂級植物種子</h4><button class="btn btn-cash" onclick="buySeedWithCash(150,'修羅弒神草')">💳 NT$150 買 修羅弒神草</button><button class="btn btn-cash" onclick="buySeedWithCash(500,'混沌萬界果')">💳 NT$500 買 混沌萬界果</button><button class="btn btn-cash" onclick="buySeedWithCash(1000,'虛無真理尊')">💳 NT$1000 買 虛無真理尊</button></div><div class="gacha-machine" style="border-color:rgba(56,189,248,0.2);background:rgba(56,189,248,0.02);"><h4 style="margin:5px 0;color:#38bdf8;font-size:13px;">🎰 隨機鑽石轉蛋池</h4><button class="btn btn-gacha-diamond" onclick="drawGacha('diamond')">💎 2 鑽石 隨機抽獎</button></div></div></div><script>let coins=500;let rubies=0;let diamonds=5;let fertilizer=2;let inventory={"雛菊":2};let potUnlockStatus=[true,false,false];const potUnlockCosts=[0,2500,15000];let potsData=[{currentPlant:null,water:100,growthProgress:0,plantStageIndex:0,isFertilized:false},{currentPlant:null,water:100,growthProgress:0,plantStageIndex:0,isFertilized:false},{currentPlant:null,water:100,growthProgress:0,plantStageIndex:0,isFertilized:false}];let selectedSeedForPlanting=null;const plantDatabase={"雛菊":{stages:["🌱","🌿","🌼"],pot:"🪴",reward:120,diamondReward:0,rarityTxt:"普通"},"向日葵":{stages:["🌱","🌿","🌻"],pot:"🪴",reward:250,diamondReward:0,rarityTxt:"普通"},"仙人掌":{stages:["🌵","🌵","🏜️"],pot:"🏺",reward:400,diamondReward:0,rarityTxt:"普通"},"幸運草":{stages:["🌱","🌿","🍀"],pot:"🏺",reward:900,diamondReward:1,rarityTxt:"稀有"},"捕蠅草":{stages:["🌱","🌿","🪴"],pot:"🏺",reward:1800,diamondReward:2,rarityTxt:"稀有"},"黃金搖錢樹":{stages:["🌱","🌿","💰"],pot:"🟨",reward:4500,diamondReward:3,rarityTxt:"傳說"},"宇宙星辰花":{stages:["✨","🔮","🌌"],pot:"🔮",reward:15000,diamondReward:8,rarityTxt:"神話"},// 10大史詩級植物系列"修羅弒神草":{stages:["🌱","👹","🔥"],pot:"💀",reward:45000,diamondReward:15,rarityTxt:"史詩"},"太古吞天蓮":{stages:["🌱","🌊","🪷"],pot:"🔱",reward:75000,diamondReward:25,rarityTxt:"史詩"},"九轉涅槃花":{stages:["🌱","🔥","🦚"],pot:"♨️",reward:120000,diamondReward:45,rarityTxt:"史詩"},"荒古不滅柳":{stages:["🌿","🌲","⚡"],pot:"🧱",reward:190000,diamondReward:70,rarityTxt:"史詩"},"混沌萬界果":{stages:["🍇","🌀","🪐"],pot:"🌌",reward:300000,diamondReward:110,rarityTxt:"史詩"},"永恆時間枝":{stages:["⏳","⌛","⌛"],pot:"👑",reward:480000,diamondReward:180,rarityTxt:"史詩"},"至高天道衍":{stages:["✨","☀️","👁️"],pot:"⚪",reward:750000,diamondReward:280,rarityTxt:"史詩"},"因果輪迴晶":{stages:["🔮","⛓️","☯️"],pot:"🌀",reward:1200000,diamondReward:450,rarityTxt:"史詩"},"洪荒起源樹":{stages:["🌱","🌳","🌳"],pot:"🕋",reward:2000000,diamondReward:750,rarityTxt:"史詩"},"虛無真理尊":{stages:["✨","🌌","🌌"],pot:"💎",reward:4500000,diamondReward:1500,rarityTxt:"史詩"},// 🔴 玩家指定：紅寶石專屬「真・至高神域植物」"太初命運果實":{stages:["🌌","🌀","🍎"],pot:"👑",reward:12000000,diamondReward:4000,rarityTxt:"至尊神話"},"終焉虛空帝花":{stages:["✨","🔮","🎇"],pot:"🪐",reward:35000000,diamondReward:12000,rarityTxt:"至尊神話"},"萬劫不滅神木":{stages:["🌿","🌲","🔱"],pot:"💎",reward:99000000,diamondReward:35000,rarityTxt:"至尊神話"}};const shopItems=[{name:"神奇產量肥料",price:60,priceType:"coin"},{name:"雛菊種子",price:30,priceType:"coin",seedName:"雛菊"},{name:"向日葵種子",price:70,priceType:"coin",seedName:"向日葵"},{name:"幸運草種子",price:300,priceType:"coin",seedName:"幸運草"},{name:"黃金搖錢樹種子",price:1500,priceType:"coin",seedName:"黃金搖錢樹"},// 紅寶石專區植物{name:"🔴太初命運果實種子",price:8,priceType:"ruby",seedName:"太初命運果實"},{name:"🔴終焉虛空帝花種子",price:25,priceType:"ruby",seedName:"終焉虛空帝花"},{name:"🔴萬劫不滅神木種子",price:70,priceType:"ruby",seedName:"萬劫不滅神木"}];let gameLoop=null;function saveGame(){const saveData={coins,rubies,diamonds,fertilizer,inventory,potUnlockStatus,potsData};localStorage.setItem("dream_garden_save_v2_1_0",JSON.stringify(saveData));}function loadGame(){const dataStr=localStorage.getItem("dream_garden_save_v2_1_0");if(!dataStr)return;try{const data=JSON.parse(dataStr);coins=data.coins??500;rubies=data.rubies??0;diamonds=data.diamonds??5;fertilizer=data.fertilizer??2;inventory=data.inventory??{"雛菊":2};potUnlockStatus=data.potUnlockStatus??[true,false,false];potsData=data.potsData??[{},{},{}];}catch(e){console.error(e);}}function clearSaveData(){if(confirm("⚠️ 確定要清除所有存盤，重新開始嗎？")){localStorage.removeItem("dream_garden_save_v2_1_0");location.reload();}}function updateUI(){document.getElementById("coinTxt").innerText=coins.toLocaleString();document.getElementById("rubyTxt").innerText=rubies;document.getElementById("diamondTxt").innerText=diamonds.toLocaleString();document.getElementById("fertTxt").innerText=fertilizer;const invDiv=document.getElementById("invList");invDiv.innerHTML="";let hasSeed=false;for(let name in inventory){if(inventory[name]>0){hasSeed=true;const item=plantDatabase[name];const div=document.createElement("div");div.style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.04); margin-bottom:4px; padding:4px 8px; border-radius:8px; font-size:12px;";const tagClass=item.rarityTxt.includes("史詩")?'epic-tag':(item.rarityTxt.includes("神話")?'mythic-tag':'');div.innerHTML=`<span>🌱 <strong>${name}</strong> <span class="rarity-tag ${tagClass}">${item.rarityTxt}</span> (x${inventory[name]})</span>`;const pBtn=document.createElement("button");pBtn.className="btn-water-mini";pBtn.innerText=selectedSeedForPlanting===name?"已選":"選取";pBtn.style.background=selectedSeedForPlanting===name?"#f59e0b":"#10b981";pBtn.onclick=()=>{selectedSeedForPlanting=(selectedSeedForPlanting===name)?null:name;updateUI();};div.appendChild(pBtn);invDiv.appendChild(div);}}if(!hasSeed)invDiv.innerText="（背包空空如也）";const grid=document.getElementById("potsGrid");grid.innerHTML="";potsData.forEach((pot,idx)=>{if(!potUnlockStatus[idx]){const card=document.createElement("div");card.className="pot-card locked";card.innerHTML=`<div style="font-size:24px; margin-bottom:10px;">🔒 花盆 #${idx+1}</div><button class="btn btn-unlock" onclick="unlockPot(${idx})">🪙 ${potUnlockCosts[idx].toLocaleString()} 解鎖</button>`;grid.appendChild(card);return;}const card=document.createElement("div");card.className="pot-card";if(pot.currentPlant)card.classList.add("active-grow");if(!pot.currentPlant){card.innerHTML=`<div style="font-size:13px; color:#94a3b8; margin-bottom:4px;">花盆 #${idx+1} (空)</div><div class="plant-stage" style="opacity:0.2;">🏺</div><div class="pot-display">🪵</div><button class="btn btn-water" style="margin-top:10px;" onclick="plantSeedInPot(${idx})" ${!selectedSeedForPlanting?'disabled':''}>進行播種</button>`;}else{const item=plantDatabase[pot.currentPlant];const tagClass=item.rarityTxt.includes("史詩")?'epic-tag':(item.rarityTxt.includes("神話")?'mythic-tag':'');card.innerHTML=`<div style="font-size:12px; font-weight:bold; color:#f43f5e;">#${idx+1} ${pot.currentPlant} <span class="rarity-tag ${tagClass}">${item.rarityTxt}</span></div><div style="font-size:10px; color:#a855f7; min-height:14px;">${pot.isFertilized?'✨已施產量雙倍肥':''}</div><div class="plant-stage">${item.stages[pot.plantStageIndex]}</div><div class="pot-display">${item.pot}</div><div class="water-container"><div class="water-bar" style="width:${pot.water}%;"></div></div><button class="btn btn-water" onclick="waterPot(${idx})">💦 澆水</button><button class="btn btn-fertilize" onclick="fertilizePot(${idx})" ${pot.isFertilized?'disabled':''}>💩 施肥</button><button class="btn btn-harvest" onclick="harvestPot(${idx})" ${pot.plantStageIndex<2?'disabled':''}>💰 收成</button>`;}grid.appendChild(card);});const marketDiv=document.getElementById("marketList");marketDiv.innerHTML="";shopItems.forEach(item=>{const div=document.createElement("div");const isRuby=item.priceType==="ruby";div.style=`display:flex; justify-content:space-between; align-items:center; background:${isRuby?'rgba(168,85,247,0.06)':'rgba(255,255,255,0.03)'}; padding:8px; border-radius:8px; margin-bottom:4px; border:1px solid ${isRuby?'rgba(168,85,247,0.3)':'rgba(255,255,255,0.05)'}; font-size:12px;`;div.innerHTML=`<span><strong>${item.name}</strong> <br><span style="color:${isRuby?'#f43f5e':'#fbbf24'}">${isRuby?'🔴':'🪙'} ${item.price}</span></span>`;const buyBtn=document.createElement("button");buyBtn.className="btn-water-mini";buyBtn.innerText="購買";buyBtn.onclick=()=>buyShopItem(item);div.appendChild(buyBtn);marketDiv.appendChild(div);});}function unlockPot(idx){if(coins<potUnlockCosts[idx]){alert("❌ 解鎖金幣不夠喔！");return;}coins-=potUnlockCosts[idx];potUnlockStatus[idx]=true;saveGame();updateUI();}function plantSeedInPot(potIdx){if(!selectedSeedForPlanting)return;if(!inventory[selectedSeedForPlanting]||inventory[selectedSeedForPlanting]<=0)return;inventory[selectedSeedForPlanting]--;potsData[potIdx]={currentPlant:selectedSeedForPlanting,water:100,growthProgress:0,plantStageIndex:0,isFertilized:false};selectedSeedForPlanting=null;saveGame();updateUI();}function waterPot(idx){if(!potsData[idx].currentPlant)return;potsData[idx].water=Math.min(100,potsData[idx].water+25);saveGame();updateUI();}function fertilizePot(idx){if(!potsData[idx].currentPlant||potsData[idx].isFertilized)return;if(fertilizer<=0){alert("❌ 肥料不夠了！");return;}fertilizer--;potsData[idx].isFertilized=true;potsData[idx].growthProgress=Math.min(100,potsData[idx].growthProgress+20);saveGame();updateUI();}function harvestPot(idx){const pot=potsData[idx];if(!pot.currentPlant||pot.plantStageIndex<2)return;const item=plantDatabase[pot.currentPlant];const finalCoin=pot.isFertilized?item.reward*2:item.reward;const finalDiamond=pot.isFertilized?item.diamondReward*2:item.diamondReward;coins+=finalCoin;diamonds+=finalDiamond;alert(`🎉 成功收成【${pot.currentPlant}】！\n獲得金幣: 🪙 ${finalCoin.toLocaleString()}\n獲得遊戲鑽石: 💎 ${finalDiamond.toLocaleString()}`);potsData[idx]={currentPlant:null,water:100,growthProgress:0,plantStageIndex:0,isFertilized:false};saveGame();updateUI();}function buyShopItem(item){if(item.priceType==="coin"){if(coins<item.price){alert("❌ 遊戲金幣不足！");return;}coins-=item.price;}else{if(rubies<item.price){alert("❌ 皇家紅寶石不足！請前往真錢儲值店購買！");return;}rubies-=item.price;}if(item.type==="fert"){fertilizer++;}else if(item.type==="seed"){inventory[item.seedName]=(inventory[item.seedName]||0)+1;}saveGame();updateUI();}function buyRubyWithCash(cashAmount,rubyAmount){alert(`💳 [模擬刷卡成功]\n花費了真實生活中的 NT$ ${cashAmount} 元！\n成功充值獲得：🔴 ${rubyAmount} 顆皇家紅寶石！`);rubies+=rubyAmount;saveGame();updateUI();}function buySeedWithCash(cashAmount,seedName){alert(`💳 [模擬刷卡成功]\n花費了真實生活中的 NT$ ${cashAmount} 元！\n成功直購獲得：【${seedName}】超稀有種子 1 顆！`);inventory[seedName]=(inventory[seedName]||0)+1;saveGame();updateUI();}function drawGacha(type){if(diamonds<2){alert("❌ 遊戲鑽石不足！");return;}diamonds-=2;const allNames=Object.keys(plantDatabase);const prize=allNames[Math.floor(Math.random()*allNames.length)];inventory[prize]=(inventory[prize]||0)+1;alert(`🎰 命運抽獎！抽出：【${prize}】種子！`);saveGame();updateUI();}function startGameLoop(){if(gameLoop)clearInterval(gameLoop);gameLoop=setInterval(()=>{potsData.forEach((pot,idx)=>{if(!potUnlockStatus[idx]||!pot.currentPlant)return;if(pot.water>0){pot.water-=2;if(pot.water<0)pot.water=0;}if(pot.water>0&&pot.plantStageIndex<2){pot.growthProgress+=4;if(pot.growthProgress>=40&&pot.growthProgress<100&&pot.plantStageIndex===0)pot.plantStageIndex=1;if(pot.growthProgress>=100)pot.plantStageIndex=2;}});saveGame();updateUI();},1000);}loadGame();startGameLoop();updateUI();</script></body></html>
